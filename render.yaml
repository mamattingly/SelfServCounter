services:
  - type: web
    name: selfserv-counter
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: selfserv-counter-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: "false"
databases:
  - name: selfserv-counter-db
    plan: basic-256mb
    databaseName: selfserv_counter
    user: selfserv_counter_user
